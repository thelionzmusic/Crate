# Builds Crate for Windows on every push to main and publishes it as a GitHub release:
#   Crate-Setup-<version>.exe   installer (per-user, no admin prompt)
#   Crate-<version>-update.zip  in-app update (Settings > Install update)
name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"          # track names like "夜" in test output
  PYTHONIOENCODING: utf-8
  # Code signing switches itself on once the certificate is added as repository secrets:
  #   WINDOWS_CERT_PFX       the .pfx file, base64-encoded (certutil -encode cert.pfx cert.txt)
  #   WINDOWS_CERT_PASSWORD  its password
  SIGN: ${{ secrets.WINDOWS_CERT_PFX != '' }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python packages
        run: python -m pip install -r requirements.txt ruff

      # the code standard (pyproject.toml): a build fails on any new finding
      - name: Lint
        run: ruff check .

      # ffmpeg ships inside Crate. Cached between builds; downloads retry and fall back to a
      # GitHub-hosted build, so one site being down doesn't block a release.
      - name: Cache ffmpeg
        id: ffcache
        uses: actions/cache@v4
        with:
          path: ffmpeg-cache
          key: ffmpeg-win64-v1

      - name: Fetch ffmpeg
        shell: pwsh
        run: |
          if (-not (Test-Path ffmpeg-cache\ffmpeg.exe)) {
            $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
            $sources = @(
              "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip",
              "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip")
            $got = $false
            foreach ($url in $sources) {
              foreach ($try in 1..3) {
                try { Invoke-WebRequest $url -OutFile $zip -TimeoutSec 300; $got = $true; break }
                catch { Write-Host "ffmpeg download failed ($url, try $try): $($_.Exception.Message)"; Start-Sleep -Seconds (10 * $try) }
              }
              if ($got) { break }
            }
            if (-not $got) { throw "couldn't download ffmpeg from any source" }
            Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\ffmpeg"
            $dir = (Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1).Directory.FullName
            New-Item -ItemType Directory -Force ffmpeg-cache | Out-Null
            Copy-Item "$dir\ffmpeg.exe", "$dir\ffprobe.exe" ffmpeg-cache\
          }
          New-Item -ItemType Directory -Force bin | Out-Null
          Copy-Item ffmpeg-cache\ffmpeg.exe, ffmpeg-cache\ffprobe.exe bin\
          "$PWD\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Version
        id: v
        shell: pwsh
        run: |
          $v = (Select-String -Path crate\__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Test
        shell: pwsh
        run: |
          foreach ($t in "test_analysis", "test_export", "test_tempo_sections", "test_prolink", "test_licence", "test_anlz_folder") {
            python "tests\$t.py"
            if ($LASTEXITCODE -ne 0) { throw "$t failed" }
          }

      # the native audio engine (ASIO / WASAPI); its self-test renders through the real mixer
      - name: Build audio engine
        shell: pwsh
        run: |
          cmake -S native -B native\build -A x64
          cmake --build native\build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "engine build failed" }
          native\build\Release\crate-engine.exe --selftest
          if ($LASTEXITCODE -ne 0) { throw "engine self-test failed" }
          New-Item -ItemType Directory -Force crate\bin | Out-Null
          Copy-Item native\build\Release\crate-engine.exe crate\bin\

      - name: Build app
        run: >
          pyinstaller --noconfirm --clean --windowed --name Crate
          --icon crate\web\icon.ico
          --splash brand\splash.png
          --add-data "crate\web;crate\web"
          --add-data "crate\export\templates;crate\export\templates"
          --add-binary "bin\ffmpeg.exe;bin" --add-binary "bin\ffprobe.exe;bin"
          --add-binary "crate\bin\crate-engine.exe;crate\bin"
          --exclude-module tkinter --exclude-module matplotlib
          run_crate.py

      - name: Load signing certificate
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String("${{ secrets.WINDOWS_CERT_PFX }}"))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object FullName -match "x64" | Select-Object -Last 1
          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV

      # Signed, Windows stops warning "unknown publisher" when people open Crate
      - name: Sign app
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          & $env:SIGNTOOL sign /f "$env:RUNNER_TEMP\cert.pfx" /p "${{ secrets.WINDOWS_CERT_PASSWORD }}" /fd sha256 /tr http://timestamp.digicert.com /td sha256 /d Crate `
            dist\Crate\Crate.exe dist\Crate\_internal\crate\bin\crate-engine.exe
          if ($LASTEXITCODE -ne 0) { throw "signing failed" }

      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup --no-progress -y | Out-Null }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /DAppVersion=${{ steps.v.outputs.version }} installer\crate.iss
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }
          if ($env:SIGN -eq 'true') {
            & $env:SIGNTOOL sign /f "$env:RUNNER_TEMP\cert.pfx" /p "${{ secrets.WINDOWS_CERT_PASSWORD }}" /fd sha256 /tr http://timestamp.digicert.com /td sha256 /d Crate `
              "out\Crate-Setup-${{ steps.v.outputs.version }}.exe"
            if ($LASTEXITCODE -ne 0) { throw "installer signing failed" }
          }

      - name: Package update
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out\update\crate | Out-Null
          Copy-Item crate -Destination out\update\crate -Recurse
          Get-ChildItem out\update -Recurse -Include __pycache__ | Remove-Item -Recurse -Force
          Compress-Archive out\update\crate "out\Crate-${{ steps.v.outputs.version }}-update.zip"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Crate ${{ steps.v.outputs.version }}
          make_latest: true
          overwrite_files: true
          files: |
            out/Crate-Setup-${{ steps.v.outputs.version }}.exe
            out/Crate-${{ steps.v.outputs.version }}-update.zip
