# Code standard for Crate, checked on every build (ruff check .)
[tool.ruff]
line-length = 160
target-version = "py312"  # what the builds use
extend-exclude = ["native", "build", "dist"]

[tool.ruff.lint]
# real bugs (F, E9, B), wasted work (PERF, C4), and simpler equivalent code (SIM, UP, RET, PIE, I)
select = ["F", "E9", "B", "PERF", "C4", "SIM", "UP", "RET", "PIE", "I"]
ignore = [
  "B905",    # zip() without strict: lengths are checked where it matters
  "SIM105",  # try/except/pass reads clearer than contextlib.suppress in hot code
  "SIM108",  # ternaries aren't always clearer
  "UP031",   # printf formatting is used for byte layouts on purpose
  "E731",    # small named lambdas are used deliberately
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B007", "F841", "RET"]
