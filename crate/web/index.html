<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crate</title>
<link rel="icon" href="icon.png">
<style>
:root {
  --gap: #101113; --panel: #1d1e21; --panel2: #24252a; --ctl: #2d2e33; --ctl-hi: #383940; --well: #141518;
  --line: #303137; --text: #dcdce0; --dim: #8e8f97; --faint: #5f6068;
  --accent: #ffa733; --accent-ink: #1d1404; --sel: #2c4466; --sel-hi: #36527a; --warn: #ff6b5e;
  --r-panel: 5px; --r-ctl: 3px;
  --font: "Segoe UI Variable Text", "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-display: "Segoe UI Variable Display", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
  --spring: linear(0, 0.075, 0.227, 0.39, 0.536, 0.656, 0.75, 0.821, 0.873, 0.911, 0.938, 0.957, 0.971, 0.98, 0.986, 0.991, 0.994, 0.996, 0.997, 0.998, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--gap); color: var(--text); font: 12.5px/1.35 var(--font); overflow: hidden;
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; user-select: none; }
button, input, select { font: inherit; color: inherit; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
svg.i.fill { fill: currentColor; stroke: none; }

.btn { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; background: var(--ctl);
  border: 1px solid #3a3b41; border-radius: var(--r-ctl); cursor: pointer; white-space: nowrap; transition: transform 90ms ease-out; }
.btn:hover { background: var(--ctl-hi); }
.btn:active { transform: scale(0.97); }
.btn.icon { width: 26px; padding: 0; justify-content: center; }
.btn.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.07); }
.btn:disabled { opacity: .4; cursor: default; }
.seg { display: inline-flex; }
.seg .btn { border-radius: 0; margin-left: -1px; }
.seg .btn:first-child { border-radius: var(--r-ctl) 0 0 var(--r-ctl); margin-left: 0; }
.seg .btn:last-child { border-radius: 0 var(--r-ctl) var(--r-ctl) 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input[type=text], input[type=number], input[type=search], select {
  height: 26px; background: var(--well); border: 1px solid var(--line); border-radius: var(--r-ctl); padding: 0 8px; user-select: text; }
input:focus { border-color: #55565e; outline: none; }

.app { display: grid; grid-template-rows: 44px 1fr auto; gap: 3px; height: 100vh; padding: 3px; }
.panel { background: var(--panel); border-radius: var(--r-panel); min-height: 0; min-width: 0; }
.bar { display: flex; align-items: center; gap: 8px; padding: 0 8px; }
.brand { display: flex; align-items: center; gap: 8px; font: 600 15px/1 var(--font-display); letter-spacing: -0.01em; padding: 0 6px 0 2px; }
.brand svg { width: 24px; height: 24px; }
.lcd { display: inline-flex; flex-direction: column; justify-content: center; height: 32px; min-width: 70px; padding: 0 8px;
  background: var(--well); border: 1px solid var(--line); border-radius: var(--r-ctl); }
.lcd small { font-size: 9.5px; color: var(--faint); line-height: 1; }
.lcd b { font: 600 15px/1.1 var(--font-display); letter-spacing: -0.01em; }
.lcd input { all: unset; font: 600 15px/1.1 var(--font-display); width: 64px; cursor: text; user-select: text; }
.search { flex: 1; max-width: 460px; position: relative; display: flex; align-items: center; }
.search svg { position: absolute; left: 8px; color: var(--faint); }
.search input { width: 100%; padding-left: 28px; }
.spacer { flex: 1; }
.status { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 11.5px; min-width: 0; }
.status[hidden] { display: none; }
.status .meter { width: 90px; height: 4px; border-radius: 2px; background: var(--well); overflow: hidden; flex: none; }
.status .meter b { display: block; height: 100%; background: var(--accent); transition: width .3s; }
#jobmsg { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 300px; }

.main { display: grid; grid-template-columns: 232px 1fr; gap: 3px; min-height: 0; }
.side { overflow: auto; padding: 6px 0 16px; }
.side h3 { font-size: 11px; font-weight: 600; color: var(--faint); margin: 12px 12px 4px; display: flex; justify-content: space-between; align-items: center; }
.side h3 .btn { height: 20px; width: 20px; border-color: transparent; background: none; color: var(--dim); }
.side h3 .btn:hover { color: var(--text); background: var(--ctl); }
.item { display: flex; align-items: center; gap: 7px; height: 24px; padding: 0 10px; margin: 0 4px; border-radius: var(--r-ctl); cursor: default; white-space: nowrap; }
.item .nm { overflow: hidden; text-overflow: ellipsis; }
.item .n { margin-left: auto; color: var(--faint); font-size: 11px; }
.item:hover { background: var(--panel2); }
.item.on { background: var(--sel); }
.item.on svg { color: var(--accent); }
.item.drop { box-shadow: inset 0 0 0 1px var(--accent); }
.item svg { color: var(--dim); }
.item .tw { width: 10px; color: var(--faint); display: inline-flex; transition: transform 200ms var(--spring); }
.item .tw svg { width: 10px; height: 10px; }
.item .tw.open { transform: rotate(90deg); }
.badge { background: #4a2e10; color: var(--accent); border-radius: 8px; padding: 0 6px; font-size: 10.5px; font-weight: 600; }

.list { display: flex; flex-direction: column; }
.head { display: flex; height: 26px; align-items: center; border-bottom: 1px solid var(--line); font-size: 11px; color: var(--dim); flex: none; background: var(--panel2); border-radius: var(--r-panel) var(--r-panel) 0 0; }
.head div { padding: 0 8px; cursor: default; white-space: nowrap; overflow: hidden; }
.head div:hover { color: var(--text); }
.head div.on { color: var(--accent); }
.scroller { flex: 1; overflow: auto; position: relative; outline: none; }
.rows { position: relative; }
.r { position: absolute; left: 0; right: 0; height: 26px; display: flex; align-items: center; cursor: default; }
.r.odd { background: rgba(255,255,255,.018); }
.r > div { padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none; }
.r:hover { background: #24262c; }
.r.sel { background: var(--sel); }
.r.sel:hover { background: var(--sel-hi); }
.r.loaded > div:first-child { box-shadow: inset 2px 0 0 var(--accent); }
.r.bad { color: var(--faint); }
.r.dropline { box-shadow: inset 0 2px 0 var(--accent); }
.num { text-align: right; }
.dim { color: var(--dim); }
.key { display: inline-block; min-width: 32px; text-align: center; border-radius: 3px; padding: 0 4px; font-size: 11px; font-weight: 700; color: #111; line-height: 17px; }
.key.match { box-shadow: 0 0 0 1.5px var(--panel), 0 0 0 3px var(--text); }
.dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.cap { color: var(--accent); }
.empty { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; text-align: center; color: var(--dim); gap: 12px; }
.empty svg.logo { width: 72px; height: 72px; }
.empty strong { color: var(--text); font: 600 20px/1.2 var(--font-display); letter-spacing: -0.015em; }
.empty p { margin: 0; max-width: 380px; }

.detail { display: grid; grid-template-columns: 236px 1fr; height: 318px; overflow: hidden; }
.detail.off .editor { opacity: .25; pointer-events: none; }
.clip { border-right: 1px solid var(--line); padding: 10px; display: flex; flex-direction: column; gap: 8px; overflow: auto; }
.clip .art { width: 100%; aspect-ratio: 2.4; border-radius: var(--r-ctl); background: var(--well) center/cover; display: grid; place-items: center; color: var(--faint); flex: none; }
.clip .title { font: 600 14px/1.25 var(--font-display); letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clip .sub { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: -6px; }
.props { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; font-size: 11.5px; }
.props > span { color: var(--faint); }
.props .row { display: flex; gap: 4px; align-items: center; }
.props .btn { height: 22px; padding: 0 7px; font-size: 11px; }
.props .btn.icon { width: 22px; }
.stars { letter-spacing: 1px; color: var(--faint); cursor: pointer; font-size: 13px; }
.stars b { color: var(--accent); font-weight: 400; }
.swatches { display: flex; gap: 4px; }
.swatches i { width: 14px; height: 14px; border-radius: 3px; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); }
.swatches i.on { box-shadow: 0 0 0 1.5px var(--panel), 0 0 0 3px var(--text); }

.editor { display: grid; grid-template-rows: 18px 20px 34px minmax(0, 1fr) 38px; min-width: 0; min-height: 0; overflow: hidden; }
canvas { display: block; width: 100%; height: 100%; min-width: 0; min-height: 0; }
#ruler, #lane { cursor: pointer; }
#overview { cursor: pointer; background: var(--well); }
#detailWave { cursor: grab; background: var(--well); touch-action: none; }
.tools { display: flex; align-items: center; gap: 10px; padding: 0 10px; border-top: 1px solid var(--line); }
.pads { display: flex; gap: 3px; }
.pads .btn { width: 30px; padding: 0; justify-content: center; font-weight: 700; font-size: 11px; height: 24px; }
.pads .btn.set { color: #111; }

dialog { background: var(--panel2); color: var(--text); border: 1px solid #3a3b41; border-radius: 8px; padding: 0; width: min(600px, 94vw);
  box-shadow: 0 24px 60px rgba(0,0,0,.55); }
dialog[open] { animation: sheet-in 380ms var(--spring); }
@keyframes sheet-in { from { opacity: 0; transform: scale(.96) translateY(6px); } }
dialog::backdrop { background: rgba(6,7,9,.6); }
dialog header { padding: 16px 18px 4px; font: 600 16px/1.2 var(--font-display); letter-spacing: -0.01em; }
dialog .body { padding: 10px 18px; display: grid; gap: 14px; max-height: 68vh; overflow: auto; }
dialog footer { display: flex; justify-content: flex-end; gap: 6px; padding: 12px 18px 16px; }
.group { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.group > .gr { display: flex; align-items: center; gap: 10px; min-height: 38px; padding: 6px 12px; }
.group > * + * { border-top: 1px solid var(--line); }
.gr .lbl { flex: 1; }
.gr .lbl small { display: block; color: var(--faint); font-size: 11px; margin-top: 1px; }
.glabel { font-size: 11px; color: var(--faint); margin: 0 2px -8px; font-weight: 600; }
.switch { appearance: none; width: 30px; height: 18px; border-radius: 9px; background: #44454c; position: relative; cursor: pointer; flex: none; transition: background 160ms; margin: 0; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform 240ms var(--spring); }
.switch:checked { background: var(--accent); }
.switch:checked::after { transform: translateX(12px); }
.tree { max-height: 200px; overflow: auto; padding: 4px 0; }
.tree label { display: flex; gap: 8px; align-items: center; padding: 4px 12px; }
.tree label:hover { background: var(--panel2); }
.tree svg { color: var(--dim); }
.drive { display: flex; gap: 10px; align-items: center; padding: 8px 12px; cursor: pointer; }
.drive:has(input:checked) { background: #2a2416; }
.drive input { accent-color: var(--accent); }
.drive small { display: block; color: var(--faint); }
.progress { height: 5px; background: var(--well); border-radius: 3px; overflow: hidden; }
.progress b { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.warns { color: var(--accent); display: grid; gap: 4px; }
.menu { position: fixed; background: var(--panel2); border: 1px solid #3a3b41; border-radius: 6px; padding: 4px; z-index: 20; min-width: 180px;
  box-shadow: 0 12px 32px rgba(0,0,0,.5); animation: sheet-in 220ms var(--spring); transform-origin: top left; }
.menu div { padding: 5px 10px; border-radius: 4px; cursor: default; }
.menu div:hover { background: var(--sel); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }
.toast { position: fixed; left: 50%; bottom: 336px; transform: translateX(-50%); background: var(--panel2); border: 1px solid #3a3b41;
  border-radius: 6px; padding: 8px 14px; z-index: 30; max-width: 520px; box-shadow: 0 12px 32px rgba(0,0,0,.5); animation: toast-in 320ms var(--spring); }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (prefers-contrast: more) { :root { --line: #55565e; --dim: #b4b5bc; --faint: #8e8f97; } }
@media (max-width: 900px) { .main { grid-template-columns: 1fr; } .side { display: none; } .detail { grid-template-columns: 1fr; } .clip { display: none; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="logo" viewBox="0 0 1024 1024"><rect width="1024" height="1024" rx="228" fill="#26262b"/><rect x="236" y="220" width="404" height="600" rx="46" fill="#3a7bff" transform="rotate(-17 438 760)"/><rect x="304" y="220" width="404" height="600" rx="46" fill="#ffb340" transform="rotate(-7 506 760)"/><rect x="376" y="220" width="404" height="600" rx="46" fill="#f5f5f7" transform="rotate(3 578 760)"/><rect x="196" y="688" width="632" height="154" rx="40" fill="#3a3a41"/></symbol>
  <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></symbol>
  <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></symbol>
  <symbol id="i-folder" viewBox="0 0 16 16"><path d="M2 4.5c0-.6.4-1 1-1h3.2l1.5 1.5H13c.6 0 1 .4 1 1V12c0 .6-.4 1-1 1H3c-.6 0-1-.4-1-1z"/></symbol>
  <symbol id="i-list" viewBox="0 0 16 16"><path d="M2.5 4h7M2.5 7.5h7M2.5 11h4"/><path d="M12.5 3.5v7"/><circle cx="11.2" cy="11" r="1.6"/></symbol>
  <symbol id="i-library" viewBox="0 0 16 16"><rect x="2" y="3" width="3" height="10" rx=".6"/><rect x="6.5" y="3" width="3" height="10" rx=".6"/><path d="m10.6 3.8 2.5-.7 2.1 9.4-2.5.7z"/></symbol>
  <symbol id="i-warn" viewBox="0 0 16 16"><path d="M8 2.5 14 13H2z"/><path d="M8 6.5v3M8 11.3v.2"/></symbol>
  <symbol id="i-import" viewBox="0 0 16 16"><path d="M8 2.5v7M5 6.8 8 9.8l3-3"/><path d="M2.5 10.5V13h11v-2.5"/></symbol>
  <symbol id="i-export" viewBox="0 0 16 16"><path d="M8 10V3M5 5.7 8 2.7l3 3"/><path d="M2.5 10.5V13h11v-2.5"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 16 16"><path d="M2.5 4.5h11M2.5 11.5h11"/><circle cx="5.5" cy="4.5" r="1.6" fill="#2d2e33"/><circle cx="10.5" cy="11.5" r="1.6" fill="#2d2e33"/></symbol>
  <symbol id="i-play" viewBox="0 0 16 16"><path d="M4.5 3v10l8.5-5z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 16 16"><path d="M4.5 3h2.4v10H4.5zM9.1 3h2.4v10H9.1z"/></symbol>
  <symbol id="i-chev" viewBox="0 0 16 16"><path d="m6 4 4 4-4 4"/></symbol>
  <symbol id="i-magnet" viewBox="0 0 16 16"><path d="M4 2.5v5a4 4 0 0 0 8 0v-5"/><path d="M4 5h2.4M9.6 5H12M6.4 2.5v5a1.6 1.6 0 0 0 3.2 0v-5"/></symbol>
  <symbol id="i-metro" viewBox="0 0 16 16"><path d="M5.5 2.5h5L13 13.5H3z"/><path d="m8 11 3.5-6.5"/></symbol>
  <symbol id="i-note" viewBox="0 0 16 16"><path d="M6 12V3.5l7-1.5V10.5"/><circle cx="4.5" cy="12" r="1.8"/><circle cx="11.5" cy="10.5" r="1.8"/></symbol>
</svg>

<div class="app">
  <div class="panel bar">
    <div class="brand"><svg aria-hidden="true"><use href="#logo"/></svg>Crate</div>
    <button class="btn icon" id="play" title="Play / pause (Space)" aria-label="Play"><svg class="i fill"><use href="#i-play"/></svg></button>
    <button class="btn" id="cueBtn" title="Back to the first memory cue">Cue</button>
    <div class="lcd" title="Click to type a BPM"><small>BPM</small><input id="dBpm" inputmode="decimal" aria-label="BPM" value="–"></div>
    <div class="lcd"><small>Key</small><b id="dKey">–</b></div>
    <div class="lcd"><small>Position</small><b id="time">0:00.0</b></div>
    <div class="lcd"><small>LUFS</small><b id="dLufs">–</b></div>
    <div class="search"><svg class="i"><use href="#i-search"/></svg><input id="q" type="search" placeholder="Search   bpm:122-126   key:8A" aria-label="Search"></div>
    <div class="spacer"></div>
    <div class="status" id="status" hidden><span id="jobmsg"></span><span class="meter"><b id="jobbar" style="width:0"></b></span></div>
    <button class="btn" id="addMusic" title="Add a music folder"><svg class="i"><use href="#i-plus"/></svg>Add music</button>
    <button class="btn" id="importRb" title="Import your rekordbox collection"><svg class="i"><use href="#i-import"/></svg>rekordbox</button>
    <button class="btn icon" id="settingsBtn" title="Settings" aria-label="Settings"><svg class="i"><use href="#i-sliders"/></svg></button>
    <button class="btn primary" id="exportBtn"><svg class="i"><use href="#i-export"/></svg>Export to USB</button>
  </div>

  <div class="main">
    <nav class="panel side" id="side" aria-label="Library"></nav>
    <section class="panel list">
      <div class="head" id="head"></div>
      <div class="scroller" id="scroller" tabindex="0"><div class="rows" id="rows"></div></div>
    </section>
  </div>

  <section class="panel detail off" id="detail">
    <div class="clip">
      <div class="art" id="art"><svg class="i" style="width:22px;height:22px"><use href="#i-note"/></svg></div>
      <div class="title" id="dTitle">No track loaded</div>
      <div class="sub" id="dSub">Double-click a track, or select one and press Enter</div>
      <div class="props">
        <span>Grid</span>
        <div class="row"><button class="btn" id="gridDown" title="Make the beat at the playhead bar 1, beat 1 (D)">Set 1.1</button>
          <div class="seg"><button class="btn icon" id="gridL" title="Nudge grid earlier ([)" aria-label="Nudge earlier">‹</button><button class="btn icon" id="gridR" title="Nudge grid later (])" aria-label="Nudge later">›</button></div>
          <div class="seg"><button class="btn" id="bpmHalf" title="Halve BPM">½</button><button class="btn" id="bpmDouble" title="Double BPM">2×</button></div></div>
        <span>Level</span><div id="dGain" class="dim">–</div>
        <span>Format</span><div id="dFormat" class="dim">–</div>
        <span>Rating</span><div class="stars" id="stars" role="group" aria-label="Rating"></div>
        <span>Colour</span><div class="swatches" id="swatches"></div>
        <span>Cues</span><div class="row"><button class="btn" id="autoCues" title="Replace this track's cues with Crate's automatic ones">Auto cues</button></div>
      </div>
    </div>
    <div class="editor">
      <canvas id="ruler"></canvas>
      <canvas id="lane"></canvas>
      <canvas id="overview"></canvas>
      <canvas id="detailWave"></canvas>
      <div class="tools">
        <div class="pads" id="pads"></div>
        <button class="btn" id="memBtn" title="Add a memory cue at the playhead (M)">Memory</button>
        <div class="spacer"></div>
        <button class="btn on" id="quant" title="Snap cues to the grid (Q)"><svg class="i"><use href="#i-magnet"/></svg>Quantise</button>
        <button class="btn" id="metro" title="Click on every beat to check the grid"><svg class="i"><use href="#i-metro"/></svg>Click</button>
        <div class="seg" role="group" aria-label="Waveform colour"><button class="btn" id="wRGB">RGB</button><button class="btn" id="w3">3-band</button></div>
      </div>
    </div>
  </section>
</div>

<dialog id="exportDlg"><header>Export to USB</header><div class="body" id="exportBody"></div><footer id="exportFoot"></footer></dialog>
<dialog id="settingsDlg"><header>Settings</header><div class="body" id="settingsBody"></div><footer><button class="btn primary" id="settingsClose">Done</button></footer></dialog>
<audio id="audio" preload="auto"></audio>
<input type="file" id="updateFile" accept=".zip" hidden>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "class") e.className = v;
    else if (k === "style") e.style.cssText = v;
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : String(c));
  return e;
};
const NS = "http://www.w3.org/2000/svg";
const icon = (name, cls = "i") => { const s = document.createElementNS(NS, "svg"); s.setAttribute("class", cls);
  const u = document.createElementNS(NS, "use"); u.setAttribute("href", "#" + name); s.append(u); return s; };
async function api(path, body) {
  const r = await fetch("/api/" + path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function toast(msg, ms = 4500) {

// ---------------------------------------------------------------- loudness target (mirrors the engine)

  target = reach.length ? Math.min(-8, Math.max(-14, Math.round(reach[Math.floor(reach.length * 0.1)] * 10) / 10)) : -10;

addEventListener("keydown", (e) => {

  if (e.key === "f" && e.ctrlKey) { e.preventDefault(); $("#q").focus(); $("#q").select(); return; }
  if (typing) { if (e.key === "Escape" || e.key === "Enter") document.activeElement.blur(); return; }
  const digit = /^Digit([1-8])$/.exec(e.code || "");

    h("div", { class: "glabel" }, "Loudness"),
    h("div", { class: "group" },
      gr("Target", st.target_mode === "auto" ? `Automatic picks ${target.toFixed(1)} LUFS, the loudest level 9 in 10 of your tracks reach with plain gain` : "Every exported copy is levelled to this",
        h("div", { style: "display:flex;gap:6px" }, h("select", { onchange: setv("target_mode", true) }, h("option", { value: "auto", selected: st.target_mode === "auto" }, "Automatic"), h("option", { value: "fixed", selected: st.target_mode !== "auto" }, "Fixed")),
          st.target_mode === "auto" ? null : h("input", { type: "number", step: "0.5", min: "-20", max: "-5", value: st.target_lufs, style: "width:72px", onchange: setv("target_lufs") }))),
      gr("True-peak ceiling", "No track is ever raised past this, so levelling can't clip", h("input", { type: "number", step: "0.1", min: "-3", max: "0", value: st.ceiling, style: "width:72px", onchange: setv("ceiling") }))),
    h("div", { class: "glabel" }, "Analysis"),
    h("div", { class: "group" },
      gr("BPM range", "Detected tempos are folded into this range", h("select", { onchange: setv("bpm_min") }, ...[["68", "68–135"], ["78", "78–155"], ["88", "88–175"], ["98", "98–195"]].map(([v, l]) => h("option", { value: v, selected: st.bpm_min === v }, l)))),
      gr("Analyse everything again", "Grids, keys and cues you set by hand are kept", h("button", { class: "btn", onclick: () => confirm("Analyse every track again?") && api("analyse", {}).then(pollSoon) }, "Analyse"))),
    h("div", { class: "glabel" }, "Music folders"),
    h("div", { class: "group" }, ...S.state.folders.map((f) => gr(f, null, h("button", { class: "btn", onclick: () => api("folders/remove", { path: f }).then(async () => { await loadState(); openSettings(); }) }, "Stop watching"))),
      gr(S.state.folders.length ? "Look for new files" : "No folders yet", null, h("div", { style: "display:flex;gap:6px" },
        h("button", { class: "btn", onclick: addFolder }, "Add folder"), S.state.folders.length ? h("button", { class: "btn", onclick: () => api("rescan", {}).then(pollSoon) }, "Rescan") : null))),
    h("div", { class: "glabel" }, "About"),
    h("div", { class: "group" }, gr(`Crate ${S.state.version}`, `Analysis runs on ${S.state.workers} threads. To update, choose the update file or drop it on this window.`,
      h("button", { class: "btn", onclick: () => $("#updateFile").click() }, "Install update"))),
  );
  $("#settingsDlg").open || $("#settingsDlg").showModal();
}
$("#settingsBtn").onclick = openSettings; $("#settingsClose").onclick = () => $("#settingsDlg").close();

// ---------------------------------------------------------------- updates
async function installUpdate(file) {
  if (!file || !/\.zip$/i.test(file.name)) return toast("Updates are .zip files.");
  const before = S.state.version;
  toast(`Installing ${file.name}`, 3000);
  const r = await fetch("/api/update", { method: "POST", body: await file.arrayBuffer() }), j = await r.json();
  if (!r.ok) return toast(j.error || "The update couldn't be installed.", 8000);
  toast(`Updating to ${j.version}. Crate restarts in a moment.`, 15000);
  const start = Date.now();
  const wait = async () => {
    try { const st = await api("state"); if (st.version !== before || Date.now() - start > 8000) return location.reload(); } catch {}
    if (Date.now() - start < 60000) setTimeout(wait, 700); else toast("Crate didn't come back. Open it again from the shortcut.", 15000);
  };
  setTimeout(wait, 1500);
}
$("#updateFile").addEventListener("change", (e) => { installUpdate(e.target.files[0]); e.target.value = ""; });
addEventListener("dragover", (e) => { if ([...e.dataTransfer.types].includes("Files")) e.preventDefault(); });
addEventListener("drop", (e) => { if (!e.dataTransfer.files.length) return; e.preventDefault(); installUpdate(e.dataTransfer.files[0]); });

// ---------------------------------------------------------------- job polling
let wasRunning = false, pollT = null, lastReload = 0;
async function poll() {
  clearTimeout(pollT);
  let j; try { j = await api("job"); } catch { pollT = setTimeout(poll, 2000); return; }
  const active = j.running || j.queued.length;
  $("#status").hidden = !active;
  $("#jobbar").style.width = `${(j.progress * 100).toFixed(1)}%`;
  $("#jobmsg").textContent = active ? `${j.name}  ${j.message}` : "";
  if (exportWatch && j.name === "Exporting") {
    exportWatch.bar.style.width = `${j.progress * 100}%`; exportWatch.msg.textContent = j.message;
    if (!j.running) {
      const { body, foot, dlg } = exportWatch; exportWatch = null;
      if (j.error) body.replaceChildren(h("div", { class: "warns" }, j.error));
      else { const r = j.result;
        body.replaceChildren(h("div", { style: "display:grid;gap:6px" }, h("strong", {}, `${r.tracks} tracks and ${r.playlists} playlists on the stick`),
          h("span", { class: "dim" }, `${r.copied} files written, the rest were already up to date.${r.target_lufs != null ? ` Levelled to ${r.target_lufs.toFixed(1)} LUFS.` : ""} Eject the drive before unplugging it.`)),
          r.warnings.length ? h("div", { class: "warns" }, ...r.warnings.map((w) => h("div", {}, w))) : null); }
      foot.replaceChildren(h("button", { class: "btn primary", onclick: () => dlg.close() }, "Done"));
    }
  }
  if (active && j.name !== "Exporting" && Date.now() - lastReload > 2000) { lastReload = Date.now(); await loadTracks(); renderSide(); }
  if (wasRunning && !active) {
    await loadState(); await loadTracks(); await loadNodes();
    if (j.error && !exportWatch) toast(j.error, 8000);
    else if (j.result && j.name === "Analysing") toast(`Analysed ${j.result.analysed} tracks in ${j.result.seconds}s${j.result.errors ? `, ${j.result.errors} couldn't be read` : ""}`);
    else if (j.result && j.name === "Importing rekordbox") toast(`Imported ${j.result.tracks} tracks and ${j.result.playlists} playlists${j.result.missing ? `. ${j.result.missing} files weren't found` : ""}`, 8000);
    if (deck.id) { const t = await api("track/" + deck.id); setTrack({ ...deck.t, ...t }); updateMeters(); renderPads(); }
  }
  wasRunning = active;
  pollT = setTimeout(poll, active ? 700 : 2500);
}
const pollSoon = () => setTimeout(poll, 150);
addEventListener("pagehide", () => navigator.sendBeacon("/api/bye"));

(async () => {
  await loadState(); await loadTracks(); await loadNodes(); renderPads(); sizeCanvases();
  setMode(localStorage.getItem("waveMode") || S.settings.waveform || "rgb"); poll();
  const last = +(/track=(\d+)/.exec(location.hash) || [])[1] || +localStorage.getItem("deck");
  if (last && S.byId.has(last)) loadDeck(last);
})();
</script>
</body>
