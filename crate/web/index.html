<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crate</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/library.css">
<link rel="stylesheet" href="css/perform.css">
<script type="module" src="js/app.js"></script>
</head>
<body>

  <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.4 10.4 13.5 13.5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3.5v9M3.5 8h9"/></symbol>
  <symbol id="i-folder" viewBox="0 0 16 16"><path d="M2.5 4.5a1 1 0 0 1 1-1h2.8l1.4 1.4h4.8a1 1 0 0 1 1 1v5.6a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-list" viewBox="0 0 16 16"><path d="M2.5 4.5h6.5M2.5 8h6.5M2.5 11.5h3.5"/><path d="M12.5 4v6.5"/><circle cx="11.2" cy="11" r="1.5"/></symbol>
  <symbol id="i-smart" viewBox="0 0 16 16"><path d="M2.5 4.5h5M2.5 8h4M2.5 11.5h3"/><path d="m11.5 3 .7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7zM11 9.5l.45 1.05 1.05.45-1.05.45L11 12.5l-.45-1.05L9.5 11l1.05-.45z"/></symbol>
  <symbol id="i-set" viewBox="0 0 16 16"><path d="M2.5 12.5c2-1 2.5-5 4.5-5s2 3 4 3 1.5-5 2.5-6"/><circle cx="2.5" cy="12.5" r="1"/><circle cx="13.5" cy="4.5" r="1"/></symbol>
  <symbol id="i-history" viewBox="0 0 16 16"><path d="M3 8a5 5 0 1 0 1.5-3.6"/><path d="M3 3v2.5h2.5M8 5.5V8l1.8 1.3"/></symbol>
  <symbol id="i-library" viewBox="0 0 16 16"><rect x="2.5" y="3" width="2.5" height="10" rx=".5"/><rect x="6.2" y="3" width="2.5" height="10" rx=".5"/><path d="m10.3 3.6 2.3-.6 2 9.3-2.3.6z"/></symbol>
  <symbol id="i-warn" viewBox="0 0 16 16"><path d="M8 2.8 14 13H2z"/><path d="M8 6.6v3M8 11.2v.1"/></symbol>
  <symbol id="i-copy" viewBox="0 0 16 16"><rect x="5" y="5" width="8" height="8" rx="1.2"/><path d="M3 10.5V4a1 1 0 0 1 1-1h6.5"/></symbol>
  <symbol id="i-heart" viewBox="0 0 16 16"><path d="M8 13s-5-3-5-6.5A2.7 2.7 0 0 1 8 5a2.7 2.7 0 0 1 5 1.5C13 10 8 13 8 13z"/></symbol>
  <symbol id="i-import" viewBox="0 0 16 16"><path d="M8 2.5v7M5 6.8l3 3 3-3"/><path d="M2.5 10.5V13h11v-2.5"/></symbol>

  <symbol id="i-play" viewBox="0 0 16 16"><path d="M5 3.2v9.6l7.8-4.8z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 16 16"><path d="M4.5 3h2.6v10H4.5zM8.9 3h2.6v10H8.9z"/></symbol>

  <symbol id="i-reveal" viewBox="0 0 16 16"><path d="M9 3h4v4M13 3 7.5 8.5"/><path d="M12 9.5V12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h2.5"/></symbol>

<div class="app">
  <header class="panel topbar">
    <div class="brand"><svg aria-hidden="true"><use href="#logo-sm"/></svg><span>Crate</span></div>
    <div class="seg mode" role="tablist" data-help="<b>Mode</b>  Library to prepare, Perform to play live  F5 / F6">
      <button class="btn sm on" id="mLib" role="tab">Library</button><button class="btn sm" id="mPerf" role="tab">Perform</button></div>
    <button class="btn icon" id="play" data-help="<b>Play / pause</b>  Space" aria-label="Play"><svg class="i fill"><use href="#i-play"/></svg></button>
    <button class="btn" id="cueBtn" data-help="<b>Cue</b>  Back to the first memory cue">Cue</button>
    <div class="readouts">
      <div class="ro" data-help="<b>Tempo</b>  Click to type a BPM. Tracks that change tempo show each one, and live-played ones show Variable"><small>BPM</small><input id="rBpm" inputmode="decimal" aria-label="BPM" value="–"></div>
      <div class="ro" data-help="<b>Key</b>  Camelot notation. Compatible tracks get an outline in the list"><small>Key</small><b id="rKey">–</b></div>
      <div class="ro" data-help="<b>Energy</b>  1 to 10, from loudness, top end, tempo and how much of the track runs at full intensity"><small>Energy</small><b id="rEnergy">–</b></div>
      <div class="ro" data-help="<b>Position</b>"><small>Position</small><canvas id="rPos" class="ctext ro-clock"></canvas></div>
    </div>
    <div class="search"><svg class="i"><use href="#i-search"/></svg><input class="field" id="q" type="search" placeholder="Search, or bpm:124 key:8A" aria-label="Search" data-help="<b>Search</b>  Text matches title, artist, album, genre, label and comments. Add bpm:, key: or energy: to filter  Ctrl+F"><span class="kbd">Ctrl F</span></div>
    <div class="spacer"></div>
    <button class="btn ghost" id="addMusic" data-help="<b>Add music</b>  Watch a folder. New files are analysed automatically"><svg class="i"><use href="#i-plus"/></svg><span class="lbl">Add music</span></button>
    <button class="btn ghost" id="importRb" data-help="<b>Import from rekordbox</b>  Brings across playlists, grids, cues, ratings and colours from rekordbox's XML export"><svg class="i"><use href="#i-import"/></svg><span class="lbl">rekordbox</span></button>
    <button class="btn sm" id="updateBtn" hidden></button>
    <button class="btn ghost icon" id="settingsBtn" data-help="<b>Settings</b>" aria-label="Settings"><svg class="i"><use href="#i-gear"/></svg></button>
    <button class="btn primary" id="exportBtn" data-help="<b>Export to USB</b>  Writes sticks any Pioneer player can read"><svg class="i"><use href="#i-export"/></svg>Export to USB</button>
  </header>

  <section class="perform" id="perform" aria-label="Performance"></section>
  <div class="split" id="psplit" data-help="<b>Resize</b>  Drag to give the decks or the library more room. Double-click to reset"></div>
  <div class="main">
    <nav class="panel side" id="side" aria-label="Library"></nav>
    <section class="panel list" id="listPanel"></section>
  </div>

  <div class="split" id="split" data-help="<b>Resize</b>  Drag to give the deck or the list more room. Double-click to reset"></div>
  <section class="panel detail off" id="detail">
    <div class="insp" id="insp"></div>
    <div class="editor">
      <canvas id="lane" data-help="<b>Phrases</b>  Click a phrase to jump to it. The pale strip underneath marks vocals"></canvas>
      <canvas id="overview" data-help="<b>Overview</b>  Click to jump. The outline shows the zoomed view"></canvas>
      <canvas id="ruler" data-help="<b>Bars</b>  Click to jump. IN and OUT mark where to bring the track in and start leaving it"></canvas>
      <canvas id="wave" data-help="<b>Waveform</b>  Drag to scrub, flick to coast, scroll to zoom. Shift-click a cue to delete it"></canvas>
      <div class="tools">
        <div class="pads" id="pads"></div>
        <button class="btn sm" id="memBtn" data-help="<b>Memory cue</b>  At the playhead  M">Memory</button>
        <div class="spacer"></div>
        <button class="btn sm on" id="quant" data-help="<b>Quantise</b>  Snap new cues to the grid  Q"><svg class="i sm"><use href="#i-magnet"/></svg>Quantise</button>
        <button class="btn sm" id="metro" data-help="<b>Click</b>  A tick on every beat, to check the grid by ear"><svg class="i sm"><use href="#i-metro"/></svg>Click</button>
        <div class="seg" data-help="<b>Waveform colour</b>  RGB: bass red, mids green, highs blue. 3-band: CDJ-3000 style"><button class="btn sm" id="wRGB">RGB</button><button class="btn sm" id="w3">3-band</button></div>
      </div>
    </div>
  </section>

  <footer class="panel status">
    <div id="info"></div>
    <div class="job" id="job" hidden><span id="jobmsg"></span><span class="bar"><b id="jobbar" style="width:0"></b></span></div>
  </footer>
</div>
<audio id="audio" preload="auto"></audio>
<input type="file" id="updateFile" accept=".zip" hidden>

</body>
</html>
